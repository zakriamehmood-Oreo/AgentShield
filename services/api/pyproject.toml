[project]
name = "agentshield-api"
version = "0.1.0"
description = "AgentShield backend: reference agent, MCP security gateway, eval engine, replay, approvals API"
requires-python = ">=3.12"
dependencies = [
    "agentshield-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.50",
    "pinecone>=6.0",
    "mcp>=1.28.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentshield"]

[tool.uv.sources]
agentshield-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
